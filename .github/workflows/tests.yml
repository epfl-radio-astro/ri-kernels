name: Tests

# Builds the CPU kernels from the checkout and runs the test suite against two
# JAX versions: the minimum supported one (the `jax>=` floor in pyproject.toml,
# read at run time so the two cannot drift) and the latest release. Each is
# paired with the oldest interpreter that version of JAX has wheels for, which
# also exercises both ends of `requires-python`.
#
# The wheels workflow tests the *published* wheels on every platform; this one
# tests a source build on Linux only, and is the fast signal on pull requests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run ruff
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff check ri_kernels tests ci

  pytest:
    name: pytest (jax ${{ matrix.jax }}, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # jaxlib 0.6.0 ships cp310-cp313 wheels, jaxlib 0.11.0 cp312-cp314.
          - { jax: minimum, python: "3.10" }
          - { jax: latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve the JAX requirement
        id: jax
        # The minimum is the `jax>=<version>` floor from [project].dependencies;
        # `jax==0.6.0` under [build-system] is a separate pin (the FFI API the
        # library is compiled against) and deliberately not matched here.
        run: |
          if [ "${{ matrix.jax }}" = "minimum" ]; then
            floor=$(python -c '
          import re, sys
          text = open("pyproject.toml", "rb").read()
          try:
              import tomllib
              deps = tomllib.loads(text.decode())["project"]["dependencies"]
              matches = [re.fullmatch(r"jax>=([0-9]+(?:\.[0-9]+)*)", d.strip()) for d in deps]
              ver = next((m.group(1) for m in matches if m), None)
          except ModuleNotFoundError:
              m = re.search(r"\"jax>=([0-9]+(?:\.[0-9]+)*)\"", text.decode())
              ver = m.group(1) if m else None
          if not ver:
              sys.exit("could not find a jax>= requirement in pyproject.toml")
          print(ver)
          ')
            echo "spec=jax==$floor" >> "$GITHUB_OUTPUT"
          else
            echo "spec=jax" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ri_kernels and its test dependencies
        # One resolve, so the pin is honoured rather than installed and then
        # upgraded by the `jax>=` dependency of the package itself.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v "${{ steps.jax.outputs.spec }}" ".[test]"
          python -c "import jax; print('jax', jax.__version__)"

      - name: Run the tests
        # From outside the checkout: the source tree has a `ri_kernels`
        # directory of its own, and only the installed package carries
        # libri_kernels.so. Assert both libraries loaded and set
        # RI_KERNELS_REQUIRE_CPU=1 so missing libraries fail instead of skip.
        working-directory: ${{ runner.temp }}
        env:
          RI_KERNELS_REQUIRE_CPU: "1"
        run: |
          python -c "from ri_kernels.jax_api import rfi_vis_op as m, rfi_analytic_vis_op as a; assert m._TAB_LIB is not None and a._TAB_LIB_ANALYTIC is not None, 'libri_kernels.so was not built or missing analytic kernels'"
          pytest -q "$GITHUB_WORKSPACE/tests"

  sanitizers:
    name: sanitizers (ASan/UBSan, multi-device CPU)
    runs-on: ubuntu-latest
    # Advisory while running ASan via LD_PRELOAD under an uninstrumented jaxlib.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jax pytest

      - name: Build CPU library with ASan and UBSan
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRI_KERNELS_CPU=ON \
            -DRI_KERNELS_CUDA=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j

      - name: Run tests under ASan/UBSan
        env:
          RI_KERNELS_LIB_DIR: ${{ github.workspace }}/build-asan
          RI_KERNELS_REQUIRE_CPU: "1"
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          XLA_FLAGS: "--xla_force_host_platform_device_count=4"
        run: |
          ASAN_SO=$(g++ -print-file-name=libasan.so)
          LD_PRELOAD="$ASAN_SO" pytest -q tests/test_rfi_vis_op.py tests/test_rfi_analytic_vis_op.py
